name: Research quotes (one-off)
on:
  push:
    branches: ["research/**"]
    paths: ["research/fetch_quotes.py", ".github/workflows/research-quotes.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_quotes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/quotes.json
          git commit -m "Research: quotes" || echo "nothing to commit"
          git push
