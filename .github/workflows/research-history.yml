name: Research price history (one-off)

on:
  push:
    branches: ["research/**"]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_history.py
      - uses: actions/upload-artifact@v4
        with:
          name: price-history
          path: research/history
