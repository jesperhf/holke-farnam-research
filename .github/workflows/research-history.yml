name: Research price history (one-off)

on:
  push:
    branches: ["research/**"]
    paths: ["research/fetch_history.py", ".github/workflows/research-history.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_history.py
      - name: Save the history to this research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/history
          git commit -m "Research: daily price history" || echo "nothing to commit"
          git push
