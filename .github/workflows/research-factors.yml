name: Research factor data (one-off)

on:
  push:
    branches: ["research/**"]
    paths: ["research/fetch_factors.py", ".github/workflows/research-factors.yml"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python research/fetch_factors.py
      - name: Save to this research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/factors research/history/*.csv
          git commit -m "Research: French factor data and extra ETF histories" || echo "nothing to commit"
          git push
